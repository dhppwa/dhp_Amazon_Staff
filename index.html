<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>D Coupon Shop</title>

  <!-- เชื่อมโยงไฟล์ Manifest สำหรับ Android / Chrome -->
  <link rel="manifest" href="manifest.json?v=15">
  <meta name="theme-color" content="#435f52">

  <!-- รองรับ iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D Coupon Shop">
  <link rel="apple-touch-icon" href="public/assets/image/icon-192.png?v=24">

  <link rel="stylesheet" href="styles.css?v=46">
  
  <!-- โหลดฟอนต์ภาษาไทยสำหรับ Canvas Printer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { margin: 0; padding: 0; }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 12px 24px;
      border-radius: 25px; font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease; z-index: 9999;
    }
    #toast.show { opacity: 1; }
    #portrait-orientation-lock {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 28px;
      box-sizing: border-box;
      background: #0b376d;
      color: #fff;
      text-align: center;
      font-family: "Noto Sans Thai", system-ui, sans-serif;
    }
    #portrait-orientation-lock .orientation-icon { font-size: 48px; line-height: 1; }
    #portrait-orientation-lock strong { font-size: 20px; }
    #portrait-orientation-lock span { opacity: .86; font-size: 15px; }
    @media screen and (orientation: landscape) and (pointer: coarse) and (max-height: 700px) {
      #portrait-orientation-lock { display: flex; }
    }
  </style>
</head>
<body>

  <div id="app"></div>
  <div id="toast" role="status"></div>
  <div id="portrait-orientation-lock" role="alert" aria-live="assertive">
    <div class="orientation-icon" aria-hidden="true">↻</div>
    <strong>กรุณาหมุนเครื่องกลับแนวตั้ง</strong>
    <span>แอปนี้รองรับการใช้งานในแนวตั้ง</span>
  </div>

  <script>
    // Android/เบราว์เซอร์ที่รองรับจะล็อกจริง ส่วน iOS ใช้หน้าจอป้องกันด้านบนแทน
    (() => {
      const lockPortrait = async () => {
        try { await window.screen?.orientation?.lock?.('portrait'); } catch (_) {}
      };
      window.addEventListener('orientationchange', lockPortrait);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) lockPortrait(); });
      lockPortrait();
    })();
  </script>

  <script>
    // ป้องกันหน้าขาวหากเกิดข้อผิดพลาดตอนเริ่มต้นแอป
    window.addEventListener('error', function (event) {
      const target = document.getElementById('app');
      if (target && !target.textContent.trim()) {
        target.innerHTML = '<div style="padding:32px;font-family:system-ui;color:#14382d"><h2>ไม่สามารถเปิดแอปได้</h2><p>กรุณารีเฟรชหน้าอีกครั้ง</p><small>' + (event.message || 'Startup error') + '</small></div>';
      }
    });
  </script>

  <!-- Supabase JS SDK -->
  <!-- Library สำหรับสแกน QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <!-- ไฟล์โค้ดของแอป -->
  <script src="config.js?v=9"></script>
  <script src="d1-client.js?v=3"></script>
  <script src="api.js?v=44"></script>
  <script src="app.js?v=241"></script>

  <!-- สคริปต์เปิดใช้งาน Service Worker สำหรับ Android PWA -->
  <script>
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      window.pwaInstallReady = true;
      window.dispatchEvent(new Event('pwa-install-available'));
    });

    window.requestPwaInstall = async () => {
      if (!deferredInstallPrompt || window.matchMedia('(display-mode: standalone)').matches) return false;
      try {
        await deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        return true;
      } finally {
        deferredInstallPrompt = null;
      }
    };

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      window.dispatchEvent(new Event('pwa-installed'));
    });

    if ('serviceWorker' in navigator) {
      let refreshingForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshingForUpdate) return;
        refreshingForUpdate = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
          .then(async (reg) => {
            await reg.update();
            console.log('SW Registered:', reg.scope);
          })
          .catch((err) => console.error('SW Error:', err));
      });
    }
  </script>
</body>
</html>
